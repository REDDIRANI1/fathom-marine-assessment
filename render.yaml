services:
  - type: pserv
    name: fathom-db
    plan: free
    ipAllowList: []

  - type: web
    name: fathom-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: (python -m app.seed_demo || echo "seed failed, continuing") && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fathom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: fathom-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
